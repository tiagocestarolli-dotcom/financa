# Checagem automática antes do deploy (validar.py na raiz).
# Se a checagem falhar, o deploy não roda e o app continua na versão anterior.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checar index.html antes de publicar
        run: python3 validar.py index.html
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCA_TIAGO }}
          channelId: live
          projectId: financa-tiago
